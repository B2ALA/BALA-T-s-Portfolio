<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance</title>
  <link rel="stylesheet" href="style.css" />
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <!-- Background Grid Layout -->
  <div class="bg-grid">
    <div class="bg-card construction"></div>
    <div class="bg-card servers"></div>
    <div class="bg-card pipelines"></div>
    <div class="bg-card electrical"></div>
  </div>

  <!-- Central Maintenance UI Card -->
  <main class="maintenance-card">
    <div class="gear-icon">
      <i class="fa-solid fa-gears"></i>
    </div>
    
    <h1>UNDER MAINTENANCE</h1>
    <p class="subtitle">We're upgrading our infrastructure.</p>
    <p class="sub-highlight">We'll be back soon.</p>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar"></div>
      <span class="progress-text">100%</span>
    </div>

    <!-- Category Indicators -->
    <div class="status-grid">
      <div class="status-item">
        <i class="fa-solid fa-dharmachakra"></i>
        <span>CONSTRUCTION<br>WORK</span>
      </div>
      <div class="status-item">
        <i class="fa-solid fa-server"></i>
        <span>SERVER<br>MANAGEMENT</span>
      </div>
      <div class="status-item">
        <i class="fa-solid fa-faucet-drip"></i>
        <span>PIPELINE<br>MANAGEMENT</span>
      </div>
      <div class="status-item">
        <i class="fa-solid fa-bolt"></i>
        <span>ELECTRICAL<br>MANAGEMENT</span>
      </div>
    </div>
  </main>

  <!-- Footer Status Bar -->
  <footer class="footer-bar">
    <div><i class="fa-solid fa-circle-check"></i> IMPROVING PERFORMANCE</div>
    <div><i class="fa-solid fa-lock"></i> ENHANCING SECURITY</div>
    <div><i class="fa-solid fa-sliders"></i> BETTER EXPERIENCE</div>
    <div><i class="fa-solid fa-clock"></i> THANK YOU FOR YOUR PATIENCE</div>
  </footer>
</body>
</html>
